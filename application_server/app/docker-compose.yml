services:
  backend:
    build: .
    ports:
      - "8080:8080"
    networks:
      - monitoring_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same Postgres as poller/docker-compose.yml (devices + interfaces live there)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/applicationdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 123
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: secret_token
      INFLUX_ORG: my_org
      INFLUX_BUCKET: network_metrics
      POLLER_API_URL: http://host.docker.internal:8000

networks:
  monitoring_network:
    external: true
    name: monitoring_network
