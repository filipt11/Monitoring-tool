influx.url=${INFLUX_URL:http://localhost:8086}
influx.token=${INFLUX_TOKEN:secret_token}
influx.org=${INFLUX_ORG:my_org}
influx.bucket=${INFLUX_BUCKET:network_metrics}
management.influx.metrics.export.enabled=false
spring.jpa.open-in-view=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.HttpMessageNotReadableException=ERROR
poller.api.url=${POLLER_API_URL:http://localhost:8000}
# In Docker Compose this must be the service name (http://anomaly-detector:8010),
# not localhost — localhost inside the app container is the app itself.
anomaly.detector.api.url=${ANOMALY_DETECTOR_API_URL:http://localhost:8010}
# In-memory Caffeine cache for expensive Influx availability queries (5 min TTL, matches poll interval)
spring.cache.type=caffeine
spring.cache.cache-names=deviceAvailability
springdoc.model-converters.pageable-converter.enabled=true